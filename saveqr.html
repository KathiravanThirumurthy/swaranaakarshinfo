<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saving Contact...</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 25%; }
  </style>
</head>
<body>
  <h3 id="msg">Saving your contact...</h3>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name");
    const phone = params.get("phone");
    const email = params.get("email");
    const address = params.get("address");

    if (name && phone && email && address) {
      let contacts = JSON.parse(localStorage.getItem("contacts")) || [];
      contacts.push({
        name, phone, email, address,
        time: new Date().toLocaleString()
      });
      localStorage.setItem("contacts", JSON.stringify(contacts));

      document.getElementById("msg").innerHTML =
        `✅ Contact Saved!<br>${name}<br>${phone}<br>${email}<br>${address}`;

      // Redirect after 3 seconds (optional)
      setTimeout(() => {
        window.location.href = "https://kathiravanthirumurthy.github.io/swaranaakarshinfo/";
      }, 3000);
    } else {
      document.getElementById("msg").innerText = "❌ Missing contact details!";
    }
  </script>
</body>
</html>
